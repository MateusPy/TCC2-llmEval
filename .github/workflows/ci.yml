name: CI

on:
  push:
    branches:
      - main
      - 'feat/50-**'
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      config_path:
        description: "Caminho do config (relativo ao repo) para o full run do Custom. Default = banco completo (issue #50)."
        required: false
        default: "experiments/full/config-custom.yaml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      eval: ${{ steps.filter.outputs.eval }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            eval:
              - 'examples/demo-chatbot/**'
              - 'llm_eval/**'
              - '.github/workflows/ci.yml'

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install "ruff>=0.4.0"

      - name: Run ruff check
        run: ruff check .

      - name: Run ruff format check
        run: ruff format --check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-typecheck-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-typecheck-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy llm_eval/

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-test-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-test-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests with coverage gate
        run: pytest --tb=short -q --cov=llm_eval --cov-report=term-missing --cov-fail-under=95

  secrets:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  eval-gate:
    name: LLM Eval Quality Gate
    runs-on: ubuntu-latest
    needs: [changes, lint, type-check, test, secrets]
    if: needs.changes.outputs.eval == 'true'
    env:
      EVAL_THRESHOLD: "3.0"
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-eval-${{ hashFiles('pyproject.toml', 'examples/demo-chatbot/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-eval-

      - name: Install framework + demo chatbot
        run: |
          pip install -e ".[dev]"
          pip install -e ./examples/demo-chatbot

      - name: Start chatbot in background
        run: |
          mkdir -p examples/demo-chatbot/results
          uvicorn chatbot.main:app --app-dir examples/demo-chatbot --port 8000 \
              > chatbot.log 2>&1 &
          echo $! > chatbot.pid

      - name: Wait for chatbot health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Chatbot pronto após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Chatbot não respondeu em 30s. Log:"
          cat chatbot.log
          exit 1

      - name: Run llm-eval
        run: llm-eval run --config examples/demo-chatbot/config.yaml

      - name: Stop chatbot
        if: always()
        run: |
          if [ -f chatbot.pid ]; then
            kill $(cat chatbot.pid) 2>/dev/null || true
          fi

      - name: Check quality gate
        run: python examples/demo-chatbot/scripts/check_gate.py examples/demo-chatbot/results/report.json

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            examples/demo-chatbot/results/report.md
            examples/demo-chatbot/results/report.json
            chatbot.log
          if-no-files-found: warn

  eval-full-custom:
    name: LLM Eval Full Run (Custom — issue #50)
    runs-on: ubuntu-latest
    # Roda via workflow_dispatch OU automaticamente em push à branch
    # experimental feat/50-* (necessário porque workflow_dispatch precisa
    # do trigger já mergeado na default branch para ser invocável).
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/feat/50'))
    timeout-minutes: 60
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      CONFIG_PATH: ${{ inputs.config_path || 'experiments/full/config-custom.yaml' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-evalfull-${{ hashFiles('pyproject.toml', 'examples/demo-chatbot/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-evalfull-

      - name: Install framework + demo chatbot
        run: |
          pip install -e ".[dev]"
          pip install -e ./examples/demo-chatbot

      - name: Resolve output dir from config
        id: outdir
        run: |
          OUT=$(python3 -c "import yaml,sys; print(yaml.safe_load(open('${CONFIG_PATH}'))['output_dir'])")
          echo "out=$OUT" >> "$GITHUB_OUTPUT"
          mkdir -p "$OUT"

      - name: Start chatbot in background
        run: |
          uvicorn chatbot.main:app --app-dir examples/demo-chatbot --port 8000 \
              > chatbot.log 2>&1 &
          echo $! > chatbot.pid

      - name: Wait for chatbot health
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Chatbot pronto após ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Chatbot não respondeu em 30s. Log:"
          cat chatbot.log
          exit 1

      - name: Run llm-eval (full run)
        run: llm-eval run --config "${CONFIG_PATH}"

      - name: Stop chatbot
        if: always()
        run: |
          if [ -f chatbot.pid ]; then
            kill $(cat chatbot.pid) 2>/dev/null || true
          fi

      - name: Integrity check
        run: |
          python3 experiments/full/scripts/integrity_check.py \
              "${{ steps.outdir.outputs.out }}/run_result.json"

      - name: Generate metadata.json
        run: |
          python3 experiments/full/scripts/gen_metadata.py \
              --run-result "${{ steps.outdir.outputs.out }}/run_result.json" \
              --config "${CONFIG_PATH}" \
              --output "${{ steps.outdir.outputs.out }}/metadata.json"

      - name: Upload eval-full-custom artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-full-custom
          path: |
            ${{ steps.outdir.outputs.out }}/run_result.json
            ${{ steps.outdir.outputs.out }}/report.json
            ${{ steps.outdir.outputs.out }}/report.md
            ${{ steps.outdir.outputs.out }}/metadata.json
            chatbot.log
          if-no-files-found: warn
          retention-days: 90
