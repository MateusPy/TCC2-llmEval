name: Release

# Dispara ao publicar uma tag de versão (ex.: v0.1.0).
# Fluxo: build -> smoke do wheel -> PyPI -> GitHub Release.
#
# O pacote é distribuído como `llm-eval-unb` (o nome `llm-eval` estava ocupado).
# O import segue `llm_eval` e o comando de CLI segue `llm-eval`.
#
# Publicamos direto no PyPI (sem etapa de TestPyPI). No lugar do smoke via
# TestPyPI, instalamos o próprio wheel recém-buildado (do artifact, sem índice)
# e rodamos a CLI + carga dos bancos antes de publicar — mesma garantia de
# "testar antes do publish real", já que o PyPI é imutável.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (sdist + wheel)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build twine

      - name: Build do pacote
        run: python -m build

      - name: twine check
        run: twine check dist/*

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  smoke:
    name: Smoke install do wheel
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar o wheel recém-buildado e rodar smoke
        run: |
          # Instala o artefato exato que será publicado (não de um índice).
          pip install dist/*.whl
          llm-eval --version
          llm-eval --help
          # Confirma que os bancos JSON embutidos vieram no wheel.
          python -c "from llm_eval.scenarios.loader import ScenarioLoader; \
            print('cenarios factual:', len(ScenarioLoader().load('factual').scenarios))"

  publish-pypi:
    name: Publicar no PyPI
    needs: smoke
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write          # OIDC / Trusted Publishing
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publicar no PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # OIDC é usado automaticamente (sem password). Fallback por token:
        # with:
        #   password: ${{ secrets.PYPI_API_TOKEN }}

  github-release:
    name: GitHub Release (anexar artefatos)
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Criar/atualizar a Release com os artefatos
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Publicado no PyPI: https://pypi.org/project/llm-eval-unb/${{ github.ref_name }}/

            Veja o [CHANGELOG](https://github.com/MateusPy/TCC2-llmEval/blob/main/CHANGELOG.md) para os detalhes desta versão.
