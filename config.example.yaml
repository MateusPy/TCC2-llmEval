# ============================================================
# llm-eval — Exemplo de configuração
# ============================================================
# Copie este arquivo para "config.yaml" e ajuste os valores.
# Variáveis no formato ${VAR_NAME} são resolvidas a partir
# de variáveis de ambiente.
#
# Reprodutibilidade: o framework rejeita identificadores de
# modelo flutuantes (ex: "gemini-1.5-pro") para providers
# nativos. Use sempre uma versão pinada (ex: "-001", "-2503")
# de modo que execuções futuras possam ser replicadas.
# ============================================================

# Chatbot a ser avaliado
provider:
  type: gemini
  api_key: "${GEMINI_API_KEY}"
  model: gemini-2.0-flash-001     # versão pinada (não use "gemini-1.5-pro")
  temperature: 0.0
  max_tokens: 1024
  seed: 42                        # opcional; passado ao SDK quando suportado

# LLM usado como juiz (avaliador)
judge:
  enabled: true
  provider:
    type: gemini
    api_key: "${GEMINI_API_KEY}"
    model: gemini-2.0-flash-001
    temperature: 0.0
    max_tokens: 2048
    seed: 42

# Dimensões de confiabilidade a avaliar
# Valores válidos: factual, consistency, robustness
dimensions:
  - factual
  - consistency
  - robustness

# Caminho para cenários customizados (null = usar banco embutido)
scenarios_path: null

# Quantas vezes repetir cada prompt (para medir variabilidade)
repetitions: 3

# Diretório de saída dos resultados
output_dir: ./results

# Formatos de relatório
output_format:
  - json
  - markdown

# ============================================================
# Exemplo de provider customizado (qualquer endpoint HTTP)
# ============================================================
# Custom providers ficam isentos da validação de pin de modelo —
# o usuário controla o endpoint e o identificador pode ser opaco.
# Mesmo assim, recomenda-se pinar quando possível.
#
# provider:
#   type: custom
#   url: "https://meu-chatbot.com/api/chat"
#   method: POST
#   headers:
#     Authorization: "Bearer ${CUSTOM_API_KEY}"
#   model: meu-modelo-v3
