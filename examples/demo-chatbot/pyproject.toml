[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "demo-chatbot"
version = "0.1.0"
description = "Chatbot tutor de Python — exemplo de integração com llm-eval como quality gate em CI."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "groq>=0.11",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["chatbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
