# ============================================================
# llm-eval — Full run (chatbot avaliado: Mistral)
# ============================================================
# Issue #50 — Execução completa do framework nos 3 chatbots.
# Espelha config-gemini.yaml trocando apenas o provider.
# ============================================================

provider:
  type: mistral
  api_key: "${MISTRAL_API_KEY}"
  model: ministral-3b-2512
  temperature: 0.0
  max_tokens: 1024
  seed: 42

judge:
  enabled: true
  provider:
    type: gemini
    api_key: "${GEMINI_API_KEY}"
    model: gemini-2.5-flash-lite
    temperature: 0.0
    max_tokens: 2048
    seed: 42

dimensions:
  - factual
  - consistency
  - robustness

scenarios_path: ./experiments/full/scenarios

repetitions: 3

output_dir: ./experiments/full/results/mistral

output_format:
  - json
  - markdown
