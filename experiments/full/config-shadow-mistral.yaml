# ============================================================
# llm-eval — Shadow run do Mistral (juiz: Mistral)
# ============================================================
# Issue #50 — Pareia com config-shadow-gemini.yaml para medir
# concordância judge × judge (ver header do shadow-gemini).
# ============================================================

provider:
  type: mistral
  api_key: "${MISTRAL_API_KEY}"
  model: ministral-3b-2512
  temperature: 0.0
  max_tokens: 1024
  seed: 42

judge:
  enabled: true
  provider:
    type: mistral
    api_key: "${MISTRAL_API_KEY}"
    model: mistral-small-2503
    temperature: 0.0
    max_tokens: 2048
    seed: 42

dimensions:
  - factual
  - consistency
  - robustness

scenarios_path: ./experiments/full/scenarios

repetitions: 3

output_dir: ./experiments/full/results/shadow-mistral

output_format:
  - json
  - markdown
