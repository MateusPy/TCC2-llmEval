[project]
name = "llm-eval"
version = "0.1.0"
description = "Framework open-source para avaliação de confiabilidade de chatbots baseados em LLMs"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Mateus Orlando Medeiros Ribeiro"},
    {name = "Johnny Da Ponte Lopes"},
]
dependencies = [
    "google-generativeai>=0.8.0",
    "mistralai>=1.0.0",
    "httpx>=0.27.0",
    "bert-score>=0.3.13",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
llm-eval = "llm_eval.cli:main"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["llm_eval*"]

[tool.setuptools.package-data]
"llm_eval.scenarios.bank" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["llm_eval"]
branch = true
omit = [
    # report generation is a stub until issue #14 lands
    "llm_eval/report.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    # Defensive raise after a loop that always returns/raises
    "raise last_error if last_error is not None",
    # Lazy SDK imports — tested via injection, not the default factory
    "from bert_score import score as bert_score_fn",
    "from mistralai import Mistral",
    # Built-in scenario bank only fails if the package install is corrupt
    "raise ScenarioLoadError\\(\\s*$",
]
show_missing = true
skip_covered = false

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py311"
